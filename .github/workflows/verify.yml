name: Verify public source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q -W error::DeprecationWarning
        working-directory: backend
      - run: python -m pytest -q -W error::DeprecationWarning
        working-directory: runtime_host
      - run: npm ci
        working-directory: frontend-v2
      - run: npm test
        working-directory: frontend-v2
      - run: npm run build
        working-directory: frontend-v2
      - run: python tools/export_public.py public-check --ref HEAD
